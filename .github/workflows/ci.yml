name: CI

# Compila y corre los tests en cada push y cada pull request.
#
# Gratuito e ilimitado mientras el repositorio sea público y `runs-on` apunte a
# un runner estándar de GitHub. Ver el comentario largo en release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela el build anterior. Sin esto, tres
# commits seguidos ocupan los tres slots de macOS que hay disponibles y el
# tercero espera a que terminen builds que ya no le importan a nadie.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Xcode
        run: |
          # Ver release.yml: el SDK de macOS 26 es un requisito duro, así que se
          # comprueba antes de compilar y no veinte minutos después.
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${NEWEST:-/Applications/Xcode.app}"
          xcodebuild -version

          SDK=$(xcrun --sdk macosx --show-sdk-version)
          echo "::notice::SDK de macOS $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::Hace falta el SDK de macOS 26 o posterior; hay $SDK"
            exit 1
          fi

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Toolchain de Metal
        run: |
          # Lo necesita MLX para compilar sus shaders. Ver release.yml.
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Compilar
        run: |
          xcodegen generate --quiet

          # El estado se captura aparte en vez de encadenar con `grep`, porque
          # `grep` devuelve 1 cuando no encuentra nada y eso mezcla dos cosas
          # que no tienen relación: si hubo coincidencias en el log y si el
          # build funcionó. Antes esto terminaba en `|| true`, que descartaba
          # las dos, y así CI estuvo en verde con el build roto.
          set +e
          xcodebuild \
            -project Susurro.xcodeproj \
            -scheme Susurro \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/dd \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          STATUS=$?
          set -e

          grep -E "error:|warning: .*Sendable|BUILD" build.log || true
          if [ $STATUS -ne 0 ]; then
            echo "::error::La compilación falló"
            tail -60 build.log
            exit 1
          fi

          # Y aparte se comprueba el ejecutable, no el directorio. Xcode arma el
          # bundle y copia los recursos *antes* de enlazar, así que un fallo de
          # enlazado deja un `.app` que existe y no tiene binario adentro. Es
          # exactamente lo que se publicó en la v1.0.0.
          BIN=build/dd/Build/Products/Release/Susurro.app/Contents/MacOS/Susurro
          if [ ! -x "$BIN" ]; then
            echo "::error::El bundle quedó sin ejecutable"
            exit 1
          fi

      - name: Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Susurro.xcodeproj \
            -scheme Susurro \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/dd \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log \
            | grep -E "error:|Test .*(passed|failed)|recorded an issue" || true

          # Swift Testing no informa por el canal de XCTest —ahí siempre dice
          # "Executed 0 tests"—, así que el veredicto se saca de sus propias
          # líneas. Sin esto, un test roto pasaría el CI en verde.
          FAILED=$(grep -c "recorded an issue" test.log; true)
          PASSED=$(grep -c 'Test ".*" passed' test.log; true)
          echo "::notice::$PASSED tests pasaron, $FAILED fallaron"
          [ "$FAILED" -eq 0 ]
          # Exigir que haya corrido *alguno*. Sin esto, un build roto da cero
          # tests ejecutados, cero fallos, y el paso pasa en verde: ausencia de
          # fallas se confunde con ausencia de pruebas.
          if [ "$PASSED" -eq 0 ]; then
            echo "::error::No corrió ningún test"
            exit 1
          fi

      - name: Verificar que el catálogo de cadenas esté al día
        run: |
          # Si alguien agrega texto visible y no lo traduce, esto lo dice en el
          # pull request en vez de que aparezca en español en una app en inglés.
          python3 Tools/localize.py --check || echo "::warning::Hay cadenas sin traducir al inglés"
